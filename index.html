<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Маршруты по метро Санкт-Петербурга</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <div id="site-nav"></div>
  </header>

  <main>
    <h1>Текстовые маршруты по метро Санкт-Петербурга</h1>
    <p>
      Выберите станцию отправления и станцию назначения — маршрут будет построен
      в виде пошагового текстового описания: вход, ориентиры на платформе и выход в город.
    </p>

    <form id="route-form">
      <div class="form-row">
        <label for="station-from-input">Станция отправления</label>
        <input
          type="text"
          id="station-from-input"
          class="combobox-input"
          autocomplete="off"
          placeholder="Начните вводить название станции"
          required
        />
        <p id="station-from-result-status" class="visually-hidden" aria-live="polite"></p>
        <div id="station-from-results" class="station-results"></div>
      </div>

      <div class="form-row">
        <label for="station-to-input">Станция назначения</label>
        <input
          type="text"
          id="station-to-input"
          class="combobox-input"
          autocomplete="off"
          placeholder="Начните вводить название станции"
          required
        />
        <p id="station-to-result-status" class="visually-hidden" aria-live="polite"></p>
        <div id="station-to-results" class="station-results"></div>
      </div>

      <div class="form-actions">
        <button type="button" id="swap-btn" aria-label="Поменять станции отправления и назначения местами">
          ⇄ Поменять местами
        </button>
        <button type="submit">Построить маршрут</button>
      </div>
    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <!--
      #result намеренно НЕ aria-live: это статический блок, который экранный
      читалка не зачитывает автоматически при появлении. Короткое уведомление
      об успехе даёт #status выше — пользователь сам решает, когда переходить
      к чтению текста маршрута.
    -->
    <section id="result"></section>
  </main>

  <script src="js/nav.js" defer></script>
  <script src="js/data-loader.js"></script>
  <script src="js/route-builder.js"></script>
  <script src="js/combobox.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
